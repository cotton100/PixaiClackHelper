name: PixaiClackHelper Windows build
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: pixais-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check version and release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package version' }
          if (!(Test-Path "release-notes/v$version.md")) { throw 'Missing release notes' }
      - run: pnpm test
      - run: pnpm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: PixaiClackHelper-Windows
          path: |
            dist/PixaiClackHelper-*-setup.exe
            dist/latest.yml
            dist/pixais-update.json
          if-no-files-found: error
